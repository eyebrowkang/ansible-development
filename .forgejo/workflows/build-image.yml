---
name: build-image
on:
  push:
    branches: [main]
    paths:
      - images/builder/**
      - .forgejo/workflows/build-image.yml
  workflow_dispatch:

# Requires two repo/org settings on Forgejo:
#   vars.REGISTRY        e.g. git.example.com
#   secrets.REGISTRY_TOKEN   a token with package:write
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # node + git so the JS actions/checkout can run; docker CLI is added below.
      image: node:20-bookworm
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile
            image: ansible-builder
          - dockerfile: Dockerfile.vagrant
            image: ansible-builder-vagrant
    steps:
      - uses: actions/checkout@v4
      - name: Install Docker CLI
        run: apt-get update && apt-get install -y --no-install-recommends docker.io
      - name: Compute immutable tag
        run: echo "TAG=$(date +%Y%m%d)-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_ENV"
      - name: Log in to Forgejo registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "${{ vars.REGISTRY }}" -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          IMG="${{ vars.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}"
          docker build -f "images/builder/${{ matrix.dockerfile }}" -t "$IMG:$TAG" -t "$IMG:latest" images/builder
          docker push "$IMG:$TAG"
          docker push "$IMG:latest"
