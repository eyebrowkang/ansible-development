---
name: build-image
on:
  push:
    branches: [main]
    paths:
      - images/builder/**
      - .forgejo/workflows/build-image.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1            # push images one at a time — less load on the registry
      matrix:
        include:
          - dockerfile: images/builder/Dockerfile
            image: ansible-builder
          - dockerfile: images/builder/Dockerfile.vagrant
            image: ansible-builder-vagrant
    steps:
      - uses: actions/checkout@v5
      # Push target = this instance's built-in container registry (host derived from the URL).
      - id: registry
        run: echo "host=${GITHUB_SERVER_URL#*://}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ github.actor }}
          # If the instance's actions token lacks package:write, set a REGISTRY_TOKEN secret (PAT).
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.registry.outputs.host }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
      - name: Build and push
        # Plain docker build + push -> a Docker schema2 manifest. buildx/buildkit pushes
        # an OCI manifest that this Forgejo registry rejects ("failed to push ... unknown",
        # after the layers upload fine). amd64 only (host arch); no buildx needed.
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_args=$(printf -- '-t %s ' $TAGS)
          docker build $tag_args -f "${{ matrix.dockerfile }}" images/builder
          for t in $TAGS; do
            docker push "$t"
          done
