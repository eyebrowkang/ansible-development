---
name: build-image
on:
  push:
    branches: [main]
    paths:
      - images/builder/**
      - .forgejo/workflows/build-image.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: images/builder/Dockerfile
            image: ansible-builder
            platforms: linux/amd64,linux/arm64
          - dockerfile: images/builder/Dockerfile.vagrant
            image: ansible-builder-vagrant
            platforms: linux/amd64   # vagrant/qemu stack: amd64 only (arm64 build is impractical)
    steps:
      - uses: actions/checkout@v5
      # Push target = this instance's built-in container registry (host derived from the URL).
      - id: registry
        run: echo "host=${GITHUB_SERVER_URL#*://}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ github.actor }}
          # If the instance's actions token lacks package:write, set a REGISTRY_TOKEN secret (PAT).
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.registry.outputs.host }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: images/builder
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
