---
name: test-template
# Self-test for the copier template. Generates a role / a collection across the answer
# matrix and lints them (every conditional path rendered at least once), plus gated
# molecule (docker) + ansible-test sanity smokes. Runs on the self-hosted Forgejo runner
# in the builder image — this is our own trusted template code; molecule reaches the
# host daemon via DooD.
#
# The builder image is resolved automatically by the resolve-image job: it picks the
# latest `builder/v*` release tag, so there's no hardcoded image version here. Only the
# registry host comes from a variable: vars.BUILDER_REGISTRY (e.g. git.utlas.de/eyebrowkang).
#
# Every copier-copy step below passes --vcs-ref=HEAD so the self-test generates from the
# CURRENT commit. Copier's default when copying a local git repo is the latest *tag*, so on
# a tagged checkout (or once tags are fetched) a bare `copier copy .` would silently test the
# last released template instead of the changes under review.
on:
  push:
    branches: [main]
    paths:
      - templates/**
      - copier.yml
      - pyproject.toml
      - uv.lock
      - .forgejo/workflows/test-template.yml
  pull_request:
    paths:
      - templates/**
      - copier.yml
      - pyproject.toml
      - uv.lock
      - .forgejo/workflows/test-template.yml
  workflow_dispatch:

jobs:
  resolve-image:
    # Resolve the newest released builder image (latest `builder/v*` tag) so every
    # container job below uses the current immutable version — no hardcoded BUILDER_TAG.
    runs-on: ubuntu-latest
    outputs:
      builder: ${{ steps.r.outputs.builder }}
      vagrant: ${{ steps.r.outputs.vagrant }}
    steps:
      - uses: actions/checkout@v5
      - id: r
        run: |
          reg="${{ vars.BUILDER_REGISTRY }}"
          tag="$(git ls-remote --tags --refs origin 'builder/v*' | sed 's@.*/builder/@@' | sort -V | tail -1)"
          tag="${tag:-latest}"   # fallback before the first builder/v* release
          echo "Resolved builder image tag: $tag"
          echo "builder=$reg/ansible-builder:$tag" >> "$GITHUB_OUTPUT"
          echo "vagrant=$reg/ansible-builder-vagrant:$tag" >> "$GITHUB_OUTPUT"
      - name: Validate the static renovate.json templates
        # renovate.json is a static (non-.jinja) file, identical for both kinds, so it's
        # de-duplicated: both paths below are relative symlinks into templates/_shared/
        # (json.tool follows them transparently). Validating both still proves each
        # symlink resolves to valid JSON. Validate here once instead of per lint variant.
        run: |
          python3 -m json.tool "templates/role/template/{% if dependency_updates %}renovate.json{% endif %}" >/dev/null
          python3 -m json.tool "templates/collection/template/{% if dependency_updates %}renovate.json{% endif %}" >/dev/null

  lint-role:
    # Generate a role per answer combination and lint it. The matrix exercises every
    # conditional path (CI dirs, vagrant scenario, tests/, systemd image, release
    # automation) at least once — NOT the full product. role_name has no default.
    needs: resolve-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.builder }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: defaults        # forgejo CI dir + docker+vagrant scenarios + systemd image
            data: ""
            scenario: default
            shellcheck: false
          - name: github-release  # .github CI dir + release automation bundle
            data: -d ci_platform=github
            scenario: default
            shellcheck: false
          - name: both-shell      # both CI dirs + tests/ dir + shellcheck, release off
            data: -d ci_platform=both -d shell_templates=true -d release_automation=false
            scenario: default
            shellcheck: true
          - name: minimal          # docker-only (no vagrant) + non-systemd (slim) image
            data: -d include_vagrant=false -d needs_systemd=false
            scenario: default
            shellcheck: false
          - name: vagrant-only     # no docker scenario (vagrant-only); exercises include_docker=false
            data: -d include_docker=false
            scenario: vagrant
            shellcheck: false
          - name: adversarial      # quotes/colons in free-text — locks the | tojson escaping invariant
            data: "-d 'author=a:b \"c\"' -d 'role_description=a \"b\": c'"
            scenario: default
            shellcheck: false
          - name: no-collections   # empty galaxy_collections -> meta + vagrant collections.yml render []
            data: -d galaxy_collections='[]'
            scenario: default
            shellcheck: false
    steps:
      - uses: actions/checkout@v5
      - name: Install scaffold toolchain (copier)
        run: uv sync
      - name: Generate role (${{ matrix.name }})
        run: >-
          uv run copier copy --defaults --vcs-ref=HEAD -d role_name=testrole ${{ matrix.data }}
          . "${{ runner.temp }}/eyebrowkang.testrole"
      # REQUIRED before molecule/ansible-lint: the role must be its own git repo or
      # ansible-compat's git file collection fails with "glob failed".
      - name: git init the generated role
        working-directory: ${{ runner.temp }}/eyebrowkang.testrole
        run: |
          git init -q
          git add -A
          git -c user.email=ci@local -c user.name=ci commit -q -m "init from template"
      - name: Install role toolchain
        working-directory: ${{ runner.temp }}/eyebrowkang.testrole
        run: uv sync
      - name: Install Galaxy collections
        working-directory: ${{ runner.temp }}/eyebrowkang.testrole
        run: uv run ansible-galaxy collection install -r molecule/${{ matrix.scenario }}/collections.yml
      - name: yamllint
        working-directory: ${{ runner.temp }}/eyebrowkang.testrole
        run: uv run yamllint .
      - name: ansible-lint
        working-directory: ${{ runner.temp }}/eyebrowkang.testrole
        run: uv run ansible-lint
      - name: shellcheck rendered templates
        if: ${{ matrix.shellcheck }}
        working-directory: ${{ runner.temp }}/eyebrowkang.testrole
        run: uv run bash tests/shellcheck.sh

  update-role:
    # Exercise `copier update` (the backfill that justifies copier over cookiecutter):
    # generate a role at the fork point with the target branch, then update it to HEAD and
    # re-lint. Catches template changes that break the three-way merge or the recorded
    # _src_path. fetch-depth:0 so copier can resolve both the base ref and HEAD.
    needs: resolve-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.builder }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install scaffold toolchain (copier)
        run: uv sync
      - name: Pick base ref to generate from
        id: base
        run: |
          base_ref="${{ github.event.pull_request.base.ref }}"
          if [ -n "$base_ref" ]; then
            git fetch origin "${base_ref}:refs/remotes/origin/${base_ref}"
            base="$(git merge-base HEAD "refs/remotes/origin/$base_ref")"
          else
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "Using template base ref: $base"
          echo "ref=$base" >> "$GITHUB_OUTPUT"
      - name: Generate role at the base ref
        run: >-
          uv run copier copy --defaults --vcs-ref="${{ steps.base.outputs.ref }}"
          -d role_name=testrole "${{ github.workspace }}" "${{ runner.temp }}/eyebrowkang.testrole"
      - name: git init the generated role
        working-directory: ${{ runner.temp }}/eyebrowkang.testrole
        run: |
          git init -q
          git add -A
          git -c user.email=ci@local -c user.name=ci commit -q -m "init from template"
      - name: copier update to HEAD
        working-directory: ${{ runner.temp }}/eyebrowkang.testrole
        # Use the scaffold venv's copier (the role's own env has no copier); CWD stays the role.
        run: |
          "${{ github.workspace }}/.venv/bin/copier" update --defaults --trust --vcs-ref=HEAD
      - name: Assert clean merge (no .rej)
        working-directory: ${{ runner.temp }}/eyebrowkang.testrole
        run: |
          rej="$(git ls-files --others --exclude-standard | grep '\.rej$' || true)"
          if [ -n "$rej" ]; then echo "copier update produced conflicts:"; echo "$rej"; exit 1; fi
          echo "no .rej — update merged cleanly"
      - name: Commit the update (so lint collects every file via git)
        working-directory: ${{ runner.temp }}/eyebrowkang.testrole
        run: |
          git add -A
          git -c user.email=ci@local -c user.name=ci commit -q -m "copier update" || echo "no changes"
      - name: Re-lint the updated role
        working-directory: ${{ runner.temp }}/eyebrowkang.testrole
        run: |
          uv sync
          make deps   # installs the right scenario's collections.yml (default else vagrant)
          uv run yamllint .
          uv run ansible-lint

  lint-collection:
    # Generate a collection and lint it across answer variants. Rendered under an
    # ansible_collections/<ns>/<name> path so ansible-lint stays collection-aware.
    # 'defaults' = docker-only (collection vagrant defaults off); 'vagrant-only' exercises
    # include_docker=false + the new extensions/molecule/vagrant scenario.
    needs: resolve-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.builder }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: defaults
            data: -d ci_platform=both
            scenario: default
          - name: vagrant-only
            data: -d ci_platform=both -d include_docker=false -d include_vagrant=true
            scenario: vagrant
          - name: adversarial      # quotes/colons in free-text — locks the | tojson escaping invariant
            data: "-d ci_platform=both -d 'author=a:b \"c\"' -d 'collection_description=a \"b\": c'"
            scenario: default
          - name: plugins          # include_plugins: filter+module+units + narrowed build_ignore (lint/render only here; sanity+units in smoke-collection-plugins)
            data: -d ci_platform=both -d include_plugins=true
            scenario: default
          - name: release          # both release tracks: github (Galaxy publish) + forgejo + antsibull changelogs/ (yamllints both release.yml; changelog sanity runs in smoke-collection)
            data: -d ci_platform=both -d collection_forgejo_release=true
            scenario: default
    steps:
      - uses: actions/checkout@v5
      - name: Install scaffold toolchain (copier)
        run: uv sync
      - name: Generate collection (${{ matrix.name }})
        run: >-
          uv run copier copy --defaults --vcs-ref=HEAD -d kind=collection -d collection_name=testcoll
          ${{ matrix.data }} . "${{ runner.temp }}/ansible_collections/eyebrowkang/testcoll"
      - name: git init the generated collection
        working-directory: ${{ runner.temp }}/ansible_collections/eyebrowkang/testcoll
        run: |
          git init -q
          git add -A
          git -c user.email=ci@local -c user.name=ci commit -q -m "init from template"
      - name: Install collection toolchain
        working-directory: ${{ runner.temp }}/ansible_collections/eyebrowkang/testcoll
        run: uv sync
      - name: Install Galaxy collections
        working-directory: ${{ runner.temp }}/ansible_collections/eyebrowkang/testcoll
        run: uv run ansible-galaxy collection install -r extensions/molecule/${{ matrix.scenario }}/collections.yml
      - name: yamllint
        working-directory: ${{ runner.temp }}/ansible_collections/eyebrowkang/testcoll
        run: uv run yamllint .
      - name: ansible-lint
        working-directory: ${{ runner.temp }}/ansible_collections/eyebrowkang/testcoll
        run: uv run ansible-lint

  update-collection:
    # Same as update-role, for collections: generate a collection at the fork point with the
    # target branch, update it to HEAD, assert a clean three-way merge (no .rej), and re-lint.
    # Covers the copier-update path that lint-collection alone doesn't. fetch-depth:0 so copier
    # can resolve base + HEAD.
    needs: resolve-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.builder }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install scaffold toolchain (copier)
        run: uv sync
      - name: Pick base ref to generate from
        id: base
        run: |
          base_ref="${{ github.event.pull_request.base.ref }}"
          if [ -n "$base_ref" ]; then
            git fetch origin "${base_ref}:refs/remotes/origin/${base_ref}"
            base="$(git merge-base HEAD "refs/remotes/origin/$base_ref")"
          else
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "Using template base ref: $base"
          echo "ref=$base" >> "$GITHUB_OUTPUT"
      - name: Generate collection at the base ref
        run: >-
          uv run copier copy --defaults --vcs-ref="${{ steps.base.outputs.ref }}"
          -d kind=collection -d collection_name=testcoll -d ci_platform=both
          "${{ github.workspace }}" "${{ runner.temp }}/ansible_collections/eyebrowkang/testcoll"
      - name: git init the generated collection
        working-directory: ${{ runner.temp }}/ansible_collections/eyebrowkang/testcoll
        run: |
          git init -q
          git add -A
          git -c user.email=ci@local -c user.name=ci commit -q -m "init from template"
      - name: copier update to HEAD
        working-directory: ${{ runner.temp }}/ansible_collections/eyebrowkang/testcoll
        # Use the scaffold venv's copier (the collection's own env has no copier); CWD stays the collection.
        run: |
          "${{ github.workspace }}/.venv/bin/copier" update --defaults --trust --vcs-ref=HEAD
      - name: Assert clean merge (no .rej)
        working-directory: ${{ runner.temp }}/ansible_collections/eyebrowkang/testcoll
        run: |
          rej="$(git ls-files --others --exclude-standard | grep '\.rej$' || true)"
          if [ -n "$rej" ]; then echo "copier update produced conflicts:"; echo "$rej"; exit 1; fi
          echo "no .rej — update merged cleanly"
      - name: Commit the update (so lint collects every file via git)
        working-directory: ${{ runner.temp }}/ansible_collections/eyebrowkang/testcoll
        run: |
          git add -A
          git -c user.email=ci@local -c user.name=ci commit -q -m "copier update" || echo "no changes"
      - name: Re-lint the updated collection
        working-directory: ${{ runner.temp }}/ansible_collections/eyebrowkang/testcoll
        run: |
          uv sync
          make deps   # installs the right scenario's collections.yml (default else vagrant)
          uv run yamllint .
          uv run ansible-lint

  smoke-role:
    # End-to-end docker scenario on the default-answers role. Runs on PRs too: the docker
    # track is fast and is the core molecule path (create.yml/destroy.yml) most template
    # edits touch, so we want it to gate merges — push-to-main and dispatch run it as well.
    # It creates a privileged systemd instance on the host daemon via the runner's
    # automounted docker.sock (instance privilege comes from create.yml, not this job).
    # The slower vagrant + collection smokes below stay main/dispatch-only.
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    needs: resolve-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.builder }}
    steps:
      - uses: actions/checkout@v5
      - name: Install scaffold toolchain (copier)
        run: uv sync
      - name: Generate role (defaults)
        run: uv run copier copy --defaults --vcs-ref=HEAD -d role_name=testrole . "${{ runner.temp }}/eyebrowkang.testrole"
      - name: git init the generated role
        working-directory: ${{ runner.temp }}/eyebrowkang.testrole
        run: |
          git init -q
          git add -A
          git -c user.email=ci@local -c user.name=ci commit -q -m "init from template"
      - name: Install role toolchain
        working-directory: ${{ runner.temp }}/eyebrowkang.testrole
        run: uv sync
      - name: Molecule (docker)
        working-directory: ${{ runner.temp }}/eyebrowkang.testrole
        run: uv run molecule test
      - name: Destroy
        if: always()
        working-directory: ${{ runner.temp }}/eyebrowkang.testrole
        run: uv run molecule destroy

  smoke-role-vagrant:
    # Real vagrant/libvirt VM on the default-answers role. Gated to main/dispatch.
    # Containerized exactly like the generated role's vagrant job: the vagrant builder
    # image with --privileged, libvirtd started by hand, then `make test-vm`. This is the
    # self-test's coverage of the vagrant track (docs/molecule-301-workaround.md).
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    needs: resolve-image
    runs-on: [self-hosted, kvm]
    timeout-minutes: 30   # a stuck VM teardown shouldn't burn the runner for hours
    container:
      image: ${{ needs.resolve-image.outputs.vagrant }}
      # Forgejo container.options can't grant --privileged/--device; the runner itself must
      # be configured privileged with /dev/kvm for the vagrant track.
    steps:
      - uses: actions/checkout@v5
      - name: Start libvirt daemons
        # libvirtd under tini's subreaper mode so daemonized qemu gets reaped (else destroy
        # hangs). tini + relaxed qemu.conf are baked into the vagrant image (>= v1.2.0).
        run: |
          virtlogd -d
          setsid tini -s -- libvirtd >/tmp/libvirtd.log 2>&1 &
          for i in $(seq 30); do virsh -c qemu:///system version >/dev/null 2>&1 && break; sleep 1; done
      - name: Install scaffold toolchain (copier)
        run: uv sync
      - name: Generate role (defaults — includes the vagrant scenario)
        run: uv run copier copy --defaults --vcs-ref=HEAD -d role_name=testrole . "${{ runner.temp }}/eyebrowkang.testrole"
      - name: git init the generated role
        working-directory: ${{ runner.temp }}/eyebrowkang.testrole
        run: |
          git init -q
          git add -A
          git -c user.email=ci@local -c user.name=ci commit -q -m "init from template"
      - name: Install role toolchain (+ vagrant group)
        working-directory: ${{ runner.temp }}/eyebrowkang.testrole
        run: uv sync --group vagrant
      - name: Molecule (vagrant)
        working-directory: ${{ runner.temp }}/eyebrowkang.testrole
        run: make test-vm
      - name: Destroy
        if: always()
        working-directory: ${{ runner.temp }}/eyebrowkang.testrole
        run: make destroy-vm

  smoke-collection:
    # ansible-test sanity (--venv) + molecule (example role) on a generated collection.
    # Gated to main/dispatch (sanity --venv is slow; molecule needs the DooD daemon).
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    needs: resolve-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.builder }}
    steps:
      - uses: actions/checkout@v5
      - name: Install scaffold toolchain (copier)
        run: uv sync
      - name: Generate collection
        run: >-
          uv run copier copy --defaults --vcs-ref=HEAD -d kind=collection -d collection_name=testcoll
          . "${{ runner.temp }}/ansible_collections/eyebrowkang/testcoll"
      - name: git init the generated collection
        working-directory: ${{ runner.temp }}/ansible_collections/eyebrowkang/testcoll
        run: |
          git init -q
          git add -A
          git -c user.email=ci@local -c user.name=ci commit -q -m "init from template"
      - name: Install collection toolchain
        working-directory: ${{ runner.temp }}/ansible_collections/eyebrowkang/testcoll
        run: uv sync
      - name: ansible-test sanity
        working-directory: ${{ runner.temp }}/ansible_collections/eyebrowkang/testcoll
        run: uv run ansible-test sanity --venv --color
      - name: Molecule (example role)
        working-directory: ${{ runner.temp }}/ansible_collections/eyebrowkang/testcoll
        run: uv run molecule test
      - name: Destroy
        if: always()
        working-directory: ${{ runner.temp }}/ansible_collections/eyebrowkang/testcoll
        run: uv run molecule destroy

  smoke-collection-plugins:
    # sanity + units on a plugins collection (include_plugins=true): exercises the example
    # filter+module+module_utils, ansible-test units, and the sanity superset the roles-only
    # smoke-collection doesn't reach (validate-modules, ansible-doc). Gated to main/dispatch.
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    needs: resolve-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.builder }}
    steps:
      - uses: actions/checkout@v5
      - name: Install scaffold toolchain (copier)
        run: uv sync
      - name: Generate collection (with plugins)
        run: >-
          uv run copier copy --defaults --vcs-ref=HEAD -d kind=collection -d collection_name=testcoll
          -d include_plugins=true . "${{ runner.temp }}/ansible_collections/eyebrowkang/testcoll"
      - name: git init the generated collection
        working-directory: ${{ runner.temp }}/ansible_collections/eyebrowkang/testcoll
        run: |
          git init -q
          git add -A
          git -c user.email=ci@local -c user.name=ci commit -q -m "init from template"
      - name: Install collection toolchain
        working-directory: ${{ runner.temp }}/ansible_collections/eyebrowkang/testcoll
        run: uv sync
      - name: ansible-test sanity
        working-directory: ${{ runner.temp }}/ansible_collections/eyebrowkang/testcoll
        run: uv run ansible-test sanity --venv --color
      - name: ansible-test units
        working-directory: ${{ runner.temp }}/ansible_collections/eyebrowkang/testcoll
        run: uv run ansible-test units --venv --color
      - name: Simulate a release + re-lint
        # Locks the invariant that antsibull's generated changelogs/changelog.yaml +
        # .plugin-cache.yaml don't break yamllint/ansible-lint (they're yamllint-ignored).
        # This is the gap that let a post-release lint break slip through before.
        working-directory: ${{ runner.temp }}/ansible_collections/eyebrowkang/testcoll
        run: |
          printf 'minor_changes:\n  - Self-test change.\n' > changelogs/fragments/selftest.yml
          make changelog
          make deps
          uv run yamllint .
          uv run ansible-lint

  smoke-role-floor:
    # R6: prove the generated role actually runs on its DECLARED minimum ansible-core
    # (meta/main.yml min_ansible_version), not just the 2.21 dev toolchain it's pinned to.
    # Build a separate venv pinned to that floor and run the full docker molecule sequence —
    # catches a role that uses a feature newer than the floor it claims. Gated to main/dispatch
    # (an extra toolchain install + a molecule run). The docker scenario is the same create.yml
    # the role+collection share, so this covers the floor for both.
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    needs: resolve-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.builder }}
    steps:
      - uses: actions/checkout@v5
      - name: Install scaffold toolchain (copier)
        run: uv sync
      - name: Generate role (defaults)
        run: uv run copier copy --defaults --vcs-ref=HEAD -d role_name=testrole . "${{ runner.temp }}/eyebrowkang.testrole"
      - name: git init the generated role
        working-directory: ${{ runner.temp }}/eyebrowkang.testrole
        run: |
          git init -q
          git add -A
          git -c user.email=ci@local -c user.name=ci commit -q -m "init from template"
      - name: Build a venv pinned to the declared floor + run molecule
        working-directory: ${{ runner.temp }}/eyebrowkang.testrole
        run: |
          min="$(grep min_ansible_version meta/main.yml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          echo "Declared floor: ansible-core==${min}"
          # Pin the venv to Python 3.12: ansible-core floors below 2.18 don't run on Python 3.13,
          # and 3.12 is compatible with every floor 2.16-2.19 (mirrors the generated floor job).
          uv venv .venv-floor --python 3.12
          uv pip install -p .venv-floor "ansible-core==${min}" "molecule>=26,<27" "docker>=7"
          # molecule shells out to ansible-config/ansible-galaxy, so the floor venv must be on PATH.
          export PATH="$PWD/.venv-floor/bin:$PATH"
          ansible --version | head -1
          molecule test
      - name: Destroy
        if: always()
        working-directory: ${{ runner.temp }}/eyebrowkang.testrole
        run: |
          export PATH="$PWD/.venv-floor/bin:$PATH"
          molecule destroy || true
