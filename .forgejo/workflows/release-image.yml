---
name: release-image
# Deliberate, versioned builder-image release, on its own cadence (the toolchain changes
# rarely — independent of the scaffold's own version). Push a `builder/v*` tag, e.g.
#   git tag builder/v1.0.0 && git push origin builder/v1.0.0
# to build + push the image tagged with that version (immutable) plus sha-<short>. Pin the
# version tag in roles' builder_tag. build-image.yml still produces moving latest/main/sha
# on main pushes for dev. Push semantics (plain docker, schema2) match build-image.yml.
on:
  push:
    tags:
      - 'builder/v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1            # push images one at a time — less load on the registry
      matrix:
        include:
          - dockerfile: images/builder/Dockerfile
            image: ansible-builder
          - dockerfile: images/builder/Dockerfile.vagrant
            image: ansible-builder-vagrant
    steps:
      - uses: actions/checkout@v5
      - id: registry
        run: echo "host=${GITHUB_SERVER_URL#*://}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.registry.outputs.host }}/${{ github.repository_owner }}/${{ matrix.image }}
          # Version comes from the part after `builder/` in the tag (builder/v1.0.0 -> v1.0.0).
          tags: |
            type=match,pattern=builder/(v.*),group=1
            type=sha
      - name: Build and push
        # Plain docker build + push (schema2 manifest) — buildx's OCI manifest is rejected
        # by this Forgejo registry. amd64 only (host arch).
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_args=$(printf -- '-t %s ' $TAGS)
          docker build $tag_args -f "${{ matrix.dockerfile }}" images/builder
          for t in $TAGS; do
            docker push "$t"
          done
