# git-cliff configuration for the scaffold's own releases (push a v* tag).
# Sections mirror the role/collection release setup so everything reads alike.
# Docs: https://git-cliff.org
[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
"""
body = """
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  # everything else (ci, chore, build, style, …) is hidden — mirrors the release-please sections
  { message = ".*", skip = true },
]
filter_commits = false
tag_pattern = "^v[0-9]"   # anchored: only vX.Y.Z release tags (not archive/* or builder/v*)
sort_commits = "oldest"
