---
# Vagrant + libvirt scenario for the collection's example role — VM-only needs
# (kernel modules, reboot, real networking). Runs locally and on the self-hosted
# Forgejo [self-hosted, kvm] runner. Mirrors the standalone role's vagrant scenario,
# but resolves the role by short name via ANSIBLE_ROLES_PATH (converge uses
# `roles: [example]`), exactly like this collection's docker scenario.
#
# molecule-plugins#301: run this via `make test-vm`, which exports ANSIBLE_LIBRARY /
# ANSIBLE_FILTER_PLUGINS so Ansible can find the vagrant module/filter. A bare
# `molecule test -s vagrant` fails without those (see docs/molecule-301-workaround.md).
dependency:
  name: galaxy   # auto-installs collections.yml + requirements.yml (scenario-absolute paths)

driver:
  name: vagrant
  provider:
    name: libvirt

platforms:
  - name: example-vm
    box: debian/trixie64
    memory: 1024
    cpus: 1
    groups:
      - example_servers

provisioner:
  name: ansible
  env:
    # Resolve the collection's roles by short name (converge uses `roles: [example]`).
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
  playbooks:
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      example-vm:
        ansible_user: vagrant

verifier:
  name: ansible

scenario:
  name: vagrant
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
