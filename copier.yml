# Copier configuration for the Ansible scaffold. Generates either a ROLE or a
# COLLECTION, selected by the `kind` question (dynamic _subdirectory).
#
#   Generate (remote): copier copy https://git.utlas.de/eyebrowkang/ansible-development.git <dest>
#   Generate (local):  copier copy <abs-path-to-this-repo> <dest>   # NOT `.` — records a non-portable _src_path
#   Update:            cd <dest> && copier update --trust
#
# Roles       -> dest = roles/<namespace>.<name>
# Collections -> dest = collections/ansible_collections/<namespace>/<name>
# See docs/creating-a-role.md and docs/creating-a-collection.md for the full workflow.

_subdirectory: "templates/{{ kind }}/template"
_answers_file: ".copier-answers.yml"
_templates_suffix: ".jinja"
_min_copier_version: "9.4.0"

# trim_blocks + lstrip_blocks make {% ... %} control lines render cleanly in YAML.
_envops:
  trim_blocks: true
  lstrip_blocks: true
  keep_trailing_newline: true

# Shown after generation. The git init step is REQUIRED: the scaffold gitignores
# roles/* and collections/*, so without the artifact being its own git repo,
# molecule can't discover its scenarios ("glob failed").
_message_after_copy: |
  {% if kind == 'role' %}
  Role generated. Next steps (run inside the new role directory):

    git init && git add -A && git commit -m "init from template"   # REQUIRED before molecule
    uv sync
  {% if include_docker %}  make test          # docker scenario
  {% endif %}{% if include_vagrant %}  make test-vm       # vagrant scenario (needs libvirt + KVM)
  {% endif %}
  {% else %}
  Collection generated. Next steps (run inside the new collection directory):

    git init && git add -A && git commit -m "init from template"   # REQUIRED before molecule
    uv sync
    make sanity        # ansible-test sanity
  {% if include_docker %}  make test          # molecule (example role, docker)
  {% endif %}{% if include_vagrant %}  make test-vm       # molecule (example role, vagrant; needs libvirt + KVM)
  {% endif %}
  {% endif %}
  {% if ci_platform in ['forgejo', 'both'] and builder_tag == 'sha-REPLACE_ME' %}

  ⚠ builder_tag is still the placeholder. Set it to a real immutable tag from
    build-image.yml (e.g. sha-ab12cd3): the runner uses force_pull:false, so
    'latest'/'main' go stale and the placeholder won't pull.
  {% endif %}
  {% if forgejo_release %}

  Forgejo release: push a tag to cut a release, e.g.
    git tag v0.1.0 && git push origin v0.1.0
  → .forgejo/workflows/release.yml runs git-cliff (CHANGELOG.md) and creates the release.
  {% endif %}

# ============================================================= what to generate ===

kind:
  type: str
  help: "Generate an Ansible role or an Ansible collection?"
  choices:
    Ansible role: "role"
    Ansible collection: "collection"
  default: "role"

# ====================================================================== shared ===

namespace:
  type: str
  help: "Galaxy namespace / author handle"
  default: "eyebrowkang"
  validator: >-
    {% if not namespace %}namespace is required.
    {% elif namespace[0] not in 'abcdefghijklmnopqrstuvwxyz' %}namespace must start with a lowercase letter.
    {% elif namespace | reject('in', 'abcdefghijklmnopqrstuvwxyz0123456789_') | list | length > 0 %}namespace may contain only lowercase letters, digits, and underscores (Galaxy requires ^[a-z][a-z0-9_]*$).
    {% endif %}

author:
  type: str
  help: "Author name (role meta/main.yml or collection galaxy.yml)"
  default: "eyebrowkang"

license:
  type: str
  help: "License (SPDX id)"
  choices:
    GPL-3.0-or-later: "GPL-3.0-or-later"
    MIT: "MIT"
    Apache-2.0: "Apache-2.0"
    Proprietary / none: "none"
  default: "GPL-3.0-or-later"

min_ansible_version:
  type: str
  help: "Minimum ansible-core version (full X.Y.Z — collection meta/runtime.yml requires it). Capped at the newest version ansible-lint's meta-runtime rule accepts for requires_ansible (2.19.0); the dev/CI toolchain itself runs ansible-core 2.21.x."
  default: "2.19.0"

ci_platform:
  type: str
  help: "Which CI workflows to generate"
  choices:
    Forgejo Actions only: "forgejo"
    GitHub Actions only: "github"
    Both: "both"
  default: "forgejo"

# ========================================= shared: molecule test scenarios ===
# Both roles and collections ship molecule scenarios. At least one must be enabled
# (validated on include_vagrant, the second question). Defaults preserve prior
# behavior: roles get docker+vagrant, collections get docker only.

include_docker:
  type: bool
  help: "Add the docker molecule scenario? (fast; runs on GitHub public runners and Forgejo)"
  default: true

include_vagrant:
  type: bool
  help: "Add the vagrant+libvirt molecule scenario? (VM-only needs: kernel modules, reboot, real networking)"
  default: "{{ kind == 'role' }}"
  validator: >-
    {% if not include_docker and not include_vagrant %}At least one molecule scenario is required — enable include_docker and/or include_vagrant.
    {% endif %}

# =================================================================== role-only ===

role_name:
  type: str
  when: "{{ kind == 'role' }}"
  help: "Role name (lowercase; used as Galaxy role_name and inside files), e.g. restic"
  placeholder: "myrole"
  validator: >-
    {% if not role_name %}role_name is required.
    {% elif role_name[0] not in 'abcdefghijklmnopqrstuvwxyz' %}role_name must start with a lowercase letter.
    {% elif role_name | reject('in', 'abcdefghijklmnopqrstuvwxyz0123456789_') | list | length > 0 %}role_name may contain only lowercase letters, digits, and underscores (Galaxy requires ^[a-z][a-z0-9_]*$).
    {% endif %}

role_description:
  type: str
  when: "{{ kind == 'role' }}"
  help: "One-line role description"
  default: ""

galaxy_collections:
  type: yaml
  when: "{{ kind == 'role' }}"
  help: >-
    Galaxy collections this role depends on. Each entry is either a bare name
    (community.crypto) or a {name, version} map to pin a version constraint
    (e.g. {name: community.general, version: ">=11.0.0"}).
  default:
    - name: community.general
      version: ">=11.0.0"

needs_systemd:
  type: bool
  when: "{{ kind == 'role' }}"
  help: "Does the role manage systemd units? (uses a systemd-enabled image for the docker scenario)"
  default: true

shell_templates:
  type: bool
  when: "{{ kind == 'role' }}"
  help: "Does this role render shell-script templates (templates/**/*.sh.j2) that should be shellchecked?"
  default: false

release_automation:
  type: bool
  when: "{{ kind == 'role' and ci_platform in ['github', 'both'] }}"
  help: "Add GitHub release automation (release-please + conventional PR-title check + Dependabot + Galaxy import)?"
  default: "{{ kind == 'role' and ci_platform in ['github', 'both'] }}"

forgejo_release:
  type: bool
  when: "{{ kind == 'role' and ci_platform in ['forgejo', 'both'] }}"
  help: "Add Forgejo tag-driven release? Push a v* tag -> git-cliff regenerates CHANGELOG.md + creates a Forgejo release. The classic tag flow for self-hosted roles (not published to Galaxy)."
  default: "{{ kind == 'role' and ci_platform == 'forgejo' }}"

# ============================================================= collection-only ===

collection_name:
  type: str
  when: "{{ kind == 'collection' }}"
  help: "Collection name (lowercase; the `name` field in galaxy.yml), e.g. bootstrap"
  placeholder: "mycollection"
  validator: >-
    {% if not collection_name %}collection_name is required.
    {% elif collection_name[0] not in 'abcdefghijklmnopqrstuvwxyz' %}collection_name must start with a lowercase letter.
    {% elif collection_name | reject('in', 'abcdefghijklmnopqrstuvwxyz0123456789_') | list | length > 0 %}collection_name may contain only lowercase letters, digits, and underscores (Galaxy requires ^[a-z][a-z0-9_]*$).
    {% endif %}

collection_description:
  type: str
  when: "{{ kind == 'collection' }}"
  help: "One-line collection description"
  default: ""

collection_dependencies:
  type: yaml
  when: "{{ kind == 'collection' }}"
  help: "Collection dependencies for galaxy.yml (a map of name: version_spec)"
  default:
    community.general: ">=11.0.0"

collection_tags:
  type: yaml
  when: "{{ kind == 'collection' }}"
  help: "galaxy.yml tags (a list; include one Galaxy namespace tag: tools, infrastructure, linux, ...)"
  default:
    - tools

# ================================================= shared: Forgejo builder image ===

builder_registry:
  type: str
  help: "Forgejo registry namespace for CI builder images, e.g. git.example.com/<owner>"
  default: "git.example.com/{{ namespace }}"
  when: "{{ ci_platform in ['forgejo', 'both'] }}"

builder_tag:
  type: str
  help: "Builder image tag — PIN an immutable tag (runner uses force_pull:false): prefer a versioned 'vX.Y.Z' from a 'builder/v*' image release, else a 'sha-<short>'. Never 'latest'/'main'. Replace the placeholder default."
  default: "sha-REPLACE_ME"
  when: "{{ ci_platform in ['forgejo', 'both'] }}"
